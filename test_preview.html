<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body>
  <canvas id="c" width="240" height="180"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    const c = document.getElementById('c');
    const s=new THREE.Scene();
    const cam=new THREE.PerspectiveCamera(32,1,0.1,50);
    s.add(new THREE.HemisphereLight(0xdfe8ff,0x5a6472,1.8));
    const r=new THREE.WebGLRenderer({antialias:true,alpha:true,canvas:c});
    r.setSize(240,180);
    const loader=new GLTFLoader();
    loader.load('assets/4877d6d0-5176-495f-bbe7-cf4e9a46dd06/base_basic_shaded.glb',g=>{
      let root=g.scene.clone();
      s.add(root);
      const box=new THREE.Box3().setFromObject(root);
      const h=box.getSize(new THREE.Vector3()).y||2;
      root.scale.setScalar(2.0/h);
      box.setFromObject(root); box.getCenter(root.position).multiplyScalar(-1);
      cam.position.set(0,1.0,4);
      r.render(s,cam);
    },undefined,e=>{console.error(e);});
  </script>
</body>
</html>
