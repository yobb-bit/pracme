<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c" width="240" height="180"></canvas>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const c=document.getElementById('c');
const s=new THREE.Scene();
s.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
const r=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});
r.setSize(240,180);
r.setClearColor(0,0);
const loader=new GLTFLoader();
loader.load('assets/4877d6d0-5176-495f-bbe7-cf4e9a46dd06/base_basic_shaded.glb',g=>{
  s.add(g.scene);
  r.render(s,camera());
});
function camera(){ const cam=new THREE.PerspectiveCamera(45,1,0.1,100); cam.position.set(0,1,4); cam.lookAt(0,0.5,0); return cam; }
</script>
</body></html>
